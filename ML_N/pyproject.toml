[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-n"
version = "0.1.0"
description = "Raw TDMS signal detection and feature extraction pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "nptdms",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]